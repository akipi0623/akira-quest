<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>MY GOAL | AKIRA QUEST</title>

  <!-- 共通CSS -->
  <link rel="stylesheet" href="css/style.css">
</head>

<body>

  <!-- =========================
       ページ遷移アニメーション
  ========================== -->
  <div class="page-transition"></div>


  <!-- =========================
       共通ヘッダー
  ========================== -->
  <header class="site-header">

    <div class="header-inner">

      <!-- ロゴ（クリックでタイトル画面へ） -->
      <a href="index.html" class="logo">
        AKIRA QUEST
      </a>


      <!-- ハンバーガーボタン（スマホのときだけ表示） -->
      <button
        class="menu-toggle"
        type="button"
        aria-label="メニューを開く"
        aria-expanded="false"
        aria-controls="global-nav">
        <span></span>
        <span></span>
        <span></span>
      </button>


      <!-- メニュー（今いるページには aria-current="page" を付ける） -->
      <nav class="navigation" id="global-nav">

        <a href="profile.html">
          01 PROFILE
        </a>

        <a href="history.html">
          02 HISTORY
        </a>

        <a href="strength.html">
          03 STRENGTH
        </a>

        <a href="future.html" aria-current="page">
          04 MY GOAL
        </a>

      </nav>

    </div>

  </header>



  <!-- =========================
       FUTURE
  ========================== -->

  <main>

    <section class="section goal">

      <div class="section-header reveal">

        <p class="section-number">
          04 / 04
        </p>

        <h1 class="section-title goal-title section-title--catch">
          仲間となら、<br>
          もっと遠くまで行ける。
        </h1>

      </div>


      <!-- ステータス画面。左に主人公、右にウィンドウを並べる -->
      <div class="goal-stage">

        <!-- 主人公（後ろで光の筋がゆっくり回る） -->
        <div class="goal-hero reveal">
          <img
            class="goal-hero__image"
            src="images/akira-hero.webp"
            alt="勇者の姿のAKIRA">
          <p class="dq-window goal-hero__name">AKIRA</p>
        </div>


        <div class="goal-panels">

          <!-- メインクエスト（いちばん大きな目標） -->
          <div class="dq-window goal-quest reveal">

            <p class="dq-window__label">メインクエスト</p>

            <p class="goal-quest__title">
              36歳で年間1億円プレーヤーになる。
            </p>

            <!-- そのために（目先の目標） -->
            <p class="goal-quest__sub">そのために</p>
            <p class="goal-quest__text">
              研修を乗り切ることと、日々研鑽していくことを目先の目標としていく
            </p>

            <ul class="goal-quest__meta">
              <li>達成目安：36歳</li>
              <li>状態：冒険中</li>
            </ul>

          </div>


          <!-- サブクエスト（いま取り組んでいること） -->
          <div class="dq-window goal-sub reveal">

            <p class="dq-window__label">サブクエスト</p>

            <ul class="goal-sub__list">
              <li>1人でも生きていけるスキル獲得を目指す</li>
              <li>ベンチプレス100kg上げる</li>
            </ul>

          </div>

        </div>

      </div>

    </section>

  </main>



  <!-- =========================
       JavaScript
  ========================== -->

  <script src="js/script.js"></script>

</body>

</html>
