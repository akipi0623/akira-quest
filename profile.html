<!DOCTYPE html>
<html lang="ja">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

  <title>PROFILE | AKIRA QUEST</title>

  <link
    rel="stylesheet"
    href="css/style.css">

</head>


<body>

  <div class="page-transition"></div>


  <header class="site-header">

    <div class="header-inner">

      <!-- ロゴ（クリックでタイトル画面へ） -->
      <a href="index.html" class="logo">
        AKIRA QUEST
      </a>


      <!-- ハンバーガーボタン（スマホのときだけ表示） -->
      <button
        class="menu-toggle"
        type="button"
        aria-label="メニューを開く"
        aria-expanded="false"
        aria-controls="global-nav">
        <span></span>
        <span></span>
        <span></span>
      </button>


      <!-- メニュー（今いるページには aria-current="page" を付ける） -->
      <nav class="navigation" id="global-nav">

        <a href="profile.html" aria-current="page">
          01 PROFILE
        </a>

        <a href="history.html">
          02 HISTORY
        </a>

        <a href="strength.html">
          03 STRENGTH
        </a>

        <a href="future.html">
          04 MY GOAL
        </a>

      </nav>

    </div>

  </header>


  <main>

    <section class="section">

      <div class="section-header reveal">

        <p class="section-number">
          01 / 04
        </p>

        <h1 class="section-title section-title--catch">
          武器は、好奇心。<br>
          防具は、失敗を恐れない心。
        </h1>

      </div>


      <div class="profile-grid">

        <div class="image-wrap reveal">

          <img
            class="profile-image"
            src="images/profile.jpg"
            alt="プロフィール写真">

        </div>


        <div class="profile-text reveal">

          <p class="profile-name">
            小山 央
          </p>


          <!-- 能力値（ドラクエのステータス風）
               1行 ＝ 1つのボタン。クリック（タップ）すると、その能力のくわしい説明が開く。
               説明文は js/profile.js の PROFILE_STATS に書いてある -->
          <p class="stat-caption">
            のうりょく<span>（タップで くわしく）</span>
          </p>

          <ul class="stat-list">
            <li>
              <button class="stat" type="button" data-stat="curiosity" aria-haspopup="dialog">
                <span class="stat__name">好奇心</span>
                <span class="stat__stars" aria-hidden="true"><span class="stat__on">★★★★★</span></span>
                <span class="stat__sr">5段階中5</span>
              </button>
            </li>
            <li>
              <button class="stat" type="button" data-stat="action" aria-haspopup="dialog">
                <span class="stat__name">行動力</span>
                <span class="stat__stars" aria-hidden="true"><span class="stat__on">★★★★</span><span class="stat__off">☆</span></span>
                <span class="stat__sr">5段階中4</span>
              </button>
            </li>
            <li>
              <button class="stat" type="button" data-stat="planning" aria-haspopup="dialog">
                <span class="stat__name">計画性</span>
                <span class="stat__stars" aria-hidden="true"><span class="stat__on">★★</span><span class="stat__off">☆☆☆</span></span>
                <span class="stat__sr">5段階中2</span>
              </button>
            </li>
            <li>
              <button class="stat" type="button" data-stat="communication" aria-haspopup="dialog">
                <span class="stat__name">コミュ力</span>
                <span class="stat__stars" aria-hidden="true"><span class="stat__on">★★</span><span class="stat__off">☆☆☆</span></span>
                <span class="stat__sr">5段階中2</span>
              </button>
            </li>
            <li>
              <button class="stat" type="button" data-stat="persistence" aria-haspopup="dialog">
                <span class="stat__name">継続力</span>
                <span class="stat__stars" aria-hidden="true"><span class="stat__on">★★★</span><span class="stat__off">☆☆</span></span>
                <span class="stat__sr">5段階中3</span>
              </button>
            </li>
          </ul>

        </div>

      </div>

    </section>


  </main>


  <!-- =========================
       能力値のポップアップ
       <dialog> はブラウザに最初から用意されている「ポップアップ専用」のタグ。
       中身（能力名・星・説明文）は js/profile.js が入れ替える。
  ========================== -->
  <dialog
    id="stat-dialog"
    class="dq-dialog"
    aria-labelledby="stat-dialog-title">

    <!-- 枠線の上に乗る見出し（能力名） -->
    <h2
      id="stat-dialog-title"
      class="dq-dialog__title">
    </h2>

    <div class="dq-window dq-dialog__inner">

      <!-- 星の数 -->
      <p class="dq-dialog__stars" aria-hidden="true"></p>

      <!-- 説明文 -->
      <p class="dq-dialog__text"></p>

      <!-- 閉じるコマンド -->
      <div class="dq-dialog__commands">
        <button
          class="dq-dialog__close"
          type="button">
          とじる
        </button>
      </div>

    </div>

  </dialog>



  <script src="js/script.js"></script>

  <!-- 能力値のポップアップ（このページだけで使う） -->
  <script src="js/profile.js"></script>

</body>

</html>
